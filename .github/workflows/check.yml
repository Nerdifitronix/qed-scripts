name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest python3 on supported Macs; uv supplies it where setup-python no longer does
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} python tools/check.py
      - name: scripts start and show help
        run: uv run --no-project --python ${{ matrix.python }} python stage/stage_mac_probe.py --help
